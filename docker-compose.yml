services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: noskip
      POSTGRES_PASSWORD: noskip
      POSTGRES_DB: noskip
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U noskip -d noskip']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
