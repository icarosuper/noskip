# Every push and pull request: the same checks `bun run verify` runs locally, plus the migration
# drift check. Test databases come from the Postgres service; tests/support/env.ts already points
# at postgresql://noskip:noskip@localhost:5432, so no env vars are needed.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, types, migrations, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      - name: Lint and format (biome)
        run: bunx biome ci

      - name: Typecheck
        run: bun run typecheck

      # A schema edit without its migration makes drizzle-kit write a new file here.
      - name: Migrations match the schema
        run: |
          timeout 120 bunx drizzle-kit generate
          git add --intent-to-add drizzle
          git diff --exit-code -- drizzle

      - name: Unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build

  database:
    name: Integration and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: noskip
          POSTGRES_PASSWORD: noskip
          POSTGRES_DB: noskip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noskip -d noskip"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      - name: Integration tests
        run: bun run test:integration

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        run: bun run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/.artifacts
          retention-days: 7
